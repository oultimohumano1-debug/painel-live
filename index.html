    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --warning: #f59e0b;
      --meme: #d946ef; /* Cor roxa para diferenciar os memes */
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .title-area h1 {
      font-size: 1.5rem;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .panic-btn {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .panic-btn:hover {
      background-color: var(--danger-hover);
      transform: scale(1.03);
    }

    /* Painel de Automação / Modo Café */
    .auto-panel {
      background: #0f172a;
      border: 1px solid #3b82f6;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
    }

    .auto-title {
      font-weight: bold;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      width: 100%;
    }

    .auto-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    select, input[type="number"] {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    .btn-start-auto {
      background: var(--success);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-start-auto:hover {
      background: #16a34a;
    }

    .btn-stop-auto {
      background: var(--warning);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-stop-auto:hover {
      background: #d97706;
    }

    .auto-status {
      font-weight: bold;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      flex-grow: 1;
      text-align: center;
    }

    .auto-status.active {
      color: #4ade80;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }

    /* Tabs dos Blocos */
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Grid de Áudios */
    .block-content {
      display: none;
    }

    .block-content.active {
      display: block;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .audio-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .audio-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .audio-card.playing {
      border-color: var(--success);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.3);
      background: #14232c;
    }

    .audio-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text);
    }

    .audio-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .play-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: var(--accent-hover);
    }

    .playing .play-btn {
      background: var(--danger);
    }

    /* Seções Secundárias (SFX e Memes) */
    .sfx-section, .memes-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .sfx-section h2 {
      font-size: 1.2rem;
      color: var(--warning);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .memes-section h2 {
      font-size: 1.2rem;
      color: var(--meme);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sfx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .quick-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: #475569;
    }

    /* Cores ativas específicas */
    .sfx-btn:hover { border-color: var(--warning); }
    .sfx-btn.playing { background: var(--warning); color: #000; font-weight: bold; }

    .meme-btn:hover { border-color: var(--meme); }
    .meme-btn.playing { background: var(--meme); color: white; font-weight: bold; }

      { file: "sfx/18_magica.mp3", name: "18. Mágica" },
      { file: "sfx/19_relogio.mp3", name: "19. Relógio" },
      { file: "sfx/20_win.mp3", name: "20. Vitória" }
    ];

    // Variáveis de controle de áudio
    let currentMainAudio = null;
    let activeQuickAudios = []; // Array para guardar SFXs e Memes tocando
    let autoPlaylist = [];
    let autoIndex = 0;
    let isAutomationRunning = false;
    let countdownTimer = null;

    function init() {
      const tabsContainer = document.getElementById('tabsContainer');
      const blocksContainer = document.getElementById('blocksContainer');
      const memesGrid = document.getElementById('memesGrid');
      const sfxGrid = document.getElementById('sfxGrid');

      // 1. Renderizar Tabs e Blocos Principais
      blocksData.forEach((block, index) => {
        const tabBtn = document.createElement('button');
        tabBtn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        tabBtn.innerText = block.title.split(':')[0];
        tabBtn.title = block.title;
        tabBtn.onclick = () => switchTab(block.id);
        tabsContainer.appendChild(tabBtn);

        const blockDiv = document.createElement('div');
        blockDiv.className = `block-content ${index === 0 ? 'active' : ''}`;
        blockDiv.id = `block-${block.id}`;

        const grid = document.createElement('div');
        grid.className = 'audio-grid';

        block.audios.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'audio-card';
          card.id = `card-${item.file.replace(/[/.]/g, '_')}`;

          card.innerHTML = `
            <div>
              <div class="audio-title">${item.title}</div>
              <div class="audio-desc">${item.desc}</div>
            </div>
            <button class="play-btn" onclick="toggleMainPlay('${item.file}', this)">
              ▶️ Play
            </button>
          `;
          grid.appendChild(card);
        });

        blockDiv.appendChild(grid);
        blocksContainer.appendChild(blockDiv);
      });

      // 2. Renderizar Memes em Alta
      memesData.forEach(meme => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn meme-btn';
        btn.innerText = meme.name;
        btn.onclick = () => playQuickAudio(meme.file, btn);
        memesGrid.appendChild(btn);
      });

      // 3. Renderizar SFX
      sfxData.forEach(sfx => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn sfx-btn';
        btn.innerText = sfx.name;
        btn.onclick = () => playQuickAudio(sfx.file, btn);
        sfxGrid.appendChild(btn);
      });
    }

    function switchTab(blockId) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', blocksData[idx].id === blockId);
      });

      document.querySelectorAll('.block-content').forEach(content => {
        content.classList.toggle('active', content.id === `block-${blockId}`);
      });
    }

    function toggleMainPlay(filePath, button) {
      const card = button.closest('.audio-card');

      if (currentMainAudio && currentMainAudio.src.endsWith(encodeURI(filePath)) && !currentMainAudio.paused) {
        currentMainAudio.pause();
        resetMainUI();
        return;
      }

      // Parar locução principal atual antes de iniciar nova
      if (currentMainAudio) {
        currentMainAudio.pause();
        resetMainUI();
      }

      currentMainAudio = new Audio(filePath);
      button.innerText = '⏸️ Pausar';
      card.classList.add('playing');

      currentMainAudio.play().catch(err => {
        alert("Erro ao tocar o áudio. Verifique a pasta 'audios/': " + filePath);
        resetMainUI();
      });

      currentMainAudio.onended = () => {
        resetMainUI();
        if (isAutomationRunning) {
          handleNextAutoAudio();
        }
      };
    }

    function playQuickAudio(filePath, button) {
      const quickAudio = new Audio(filePath);
      activeQuickAudios.push(quickAudio); // Registra na lista de ativos (para o Pânico)
      
      button.classList.add('playing');
      
      quickAudio.play().catch(err => {
        alert("Erro ao tocar o áudio. Verifique se o arquivo existe: " + filePath);
        button.classList.remove('playing');
      });

      quickAudio.onended = () => {
        button.classList.remove('playing');
        // Remove da lista de ativos
        activeQuickAudios = activeQuickAudios.filter(a => a !== quickAudio);
      };
    }

    function stopAllAudio(stopAuto = true) {
      // 1. Para áudio principal
      if (currentMainAudio) {
        currentMainAudio.pause();
        currentMainAudio = null;
      }

      // 2. Para TODOS os SFX e Memes rodando
      activeQuickAudios.forEach(audio => audio.pause());
      activeQuickAudios = []; // Limpa a lista

      // 3. Para automação
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      if (stopAuto) {
        isAutomationRunning = false;
        updateAutoStatus("Automação Parada", false);
      }

      // 4. Reseta a interface gráfica inteira
      resetMainUI();
      document.querySelectorAll('.quick-btn').forEach(btn => btn.classList.remove('playing'));
    }

    function resetMainUI() {
      document.querySelectorAll('.audio-card').forEach(card => card.classList.remove('playing'));
      document.querySelectorAll('.play-btn').forEach(btn => btn.innerText = '▶️ Play');
    }

    // ---------------------------------------------
    // LÓGICA DO MODO AUTOMÁTICO
    // ---------------------------------------------
    function startAutomation() {
      stopAllAudio(true);

      const blockVal = document.getElementById('autoBlockSelect').value;
      autoPlaylist = [];

      if (blockVal === 'all') {
        blocksData.forEach(b => b.audios.forEach(a => autoPlaylist.push(a)));
      } else {
        const targetBlock = blocksData.find(b => b.id == blockVal);
        if (targetBlock) autoPlaylist = [...targetBlock.audios];
      }

      if (autoPlaylist.length === 0) return;

      autoIndex = 0;
      isAutomationRunning = true;
      playAutoCurrent();
    }

    function playAutoCurrent() {
      if (!isAutomationRunning || autoIndex >= autoPlaylist.length) {
        updateAutoStatus("🎉 Automação Concluída!", false);
        isAutomationRunning = false;
        return;
      }

      const item = autoPlaylist[autoIndex];
      const cardId = `card-${item.file.replace(/[/.]/g, '_')}`;
      const cardElement = document.getElementById(cardId);
      const playBtn = cardElement ? cardElement.querySelector('.play-btn') : null;

      updateAutoStatus(`🟢 Tocando (${autoIndex + 1}/${autoPlaylist.length}): ${item.title}`, true);

      if (playBtn) {
        toggleMainPlay(item.file, playBtn);
      } else {
        currentMainAudio = new Audio(item.file);
        currentMainAudio.play();
        currentMainAudio.onended = () => handleNextAutoAudio();
      }
    }

    function handleNextAutoAudio() {
      autoIndex++;

      if (autoIndex >= autoPlaylist.length) {
        updateAutoStatus("🎉 Bloco finalizado!", false);
        isAutomationRunning = false;
        return;
      }

      let intervalSec = parseInt(document.getElementById('autoInterval').value) || 30;
      let remaining = intervalSec;

      updateAutoStatus(`⏳ Aguardando ${remaining}s para o próximo áudio...`, true);

      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          updateAutoStatus(`⏳ Próximo áudio em ${remaining}s (${autoIndex + 1}/${autoPlaylist.length})...`, true);
        } else {
          clearInterval(countdownTimer);
          countdownTimer = null;
          playAutoCurrent();
        }
      }, 1000);
    }

    function stopAutomation() {
      stopAllAudio(true);
      updateAutoStatus("⏹️ Automação Parada", false);
    }

    function updateAutoStatus(text, isActive) {
      const statusEl = document.getElementById('autoStatus');
      statusEl.innerText = text;
      statusEl.classList.toggle('active', isActive);
    }

    window.onload = init;
  </script>
</body>
</html>
